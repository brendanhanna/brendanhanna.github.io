const THRESHOLDS = {
  kitchenToFood:{warn:0.13,crit:0.15,label:"Kitchen / Food Rev"},
  banqToFBBanq:{warn:0.14,crit:0.16,label:"Banquets / F&B Banq"},
  restToFBCarte:{warn:0.25,crit:0.35,label:"Restaurant / F&B À la Carte"},
  roomsToRoomRev:{warn:0.27,crit:0.32,label:"Rooms / Room Rev"},
  payrollToRev:{warn:0.25,crit:0.28,label:"Total Payroll / Revenue"},
  cogFoodToFoodRev:{warn:0.16,crit:0.19,label:"COG Food / Food Rev"},
};

const fmt = n => n>=1e6?`$${(n/1e6).toFixed(1)}M`:n>=1e3?`$${(n/1e3).toFixed(0)}K`:`$${n.toFixed(0)}`;
const pct = n => `${(n*100).toFixed(1)}%`;
const dlt = (a,b) => b!==0?((a-b)/Math.abs(b)):0;

function computeRatios(data) {
  return data.map(w => {
    const tr = w.food+w.bev+(w.rooms||0);
    const tp = w.kitchenPay+w.banqPay+w.restPay+w.roomsPay+w.adminPay+w.cateringPay;
    return {
      week:w.week, kitchenToFood:w.kitchenPay/w.food,
      banqToFBBanq:w.banqPay/(w.food*0.82),
      restToFBCarte:w.restPay>0?w.restPay/(w.food*0.12+w.bev*0.18):null,
      roomsToRoomRev:w.rooms>0?w.roomsPay/w.rooms:null,
      payrollToRev:tp/tr, cogFoodToFoodRev:w.cogFood/w.food, totalRev:tr, totalPayroll:tp,
    };
  });
}

function alertStatus(v,t){if(v==null)return"na";if(v>=t.crit)return"critical";if(v>=t.warn)return"warning";return"ok";}

const Dot = ({status}) => {
  const c={ok:"#22c55e",warning:"#f59e0b",critical:"#ef4444",na:"#6b7280"};

};

const Card = ({label,value,prev,isRatio=false}) => {
  const {theme:t}=useContext(ThemeContext);
  const d=prev?dlt(value,prev):0;
  const bad=isRatio?d>0:d<0;
  return (
    <div style={{background:t.bgCard,border:`1px solid ${t.border}`,borderRadius:8,padding:"14px 16px",minWidth:0}}>
      <div style={{fontSize:11,color:t.textMuted,letterSpacing:"0.05em",textTransform:"uppercase",marginBottom:6,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{label}</div>
      <div style={{fontSize:20,fontWeight:600,color:t.text,fontFamily:"'DM Mono',monospace"}}>{isRatio?pct(value):fmt(value)}</div>
      {prev!=null&&<div style={{fontSize:12,marginTop:4,color:bad?"#ef4444":"#22c55e",fontFamily:"'DM Mono',monospace"}}>{d>0?"▲":"▼"} {pct(Math.abs(d))} vs PY</div>}
    </div>
  );
};

const RChart = ({data,dataKey,threshold,label,color}) => {
  const {theme:t}=useContext(ThemeContext);
  return (
    <div style={{background:t.bgCard,border:`1px solid ${t.border}`,borderRadius:8,padding:"14px 16px"}}>
      <div style={{fontSize:12,color:t.textMuted,marginBottom:8}}>{label}</div>
      <ResponsiveContainer width="100%" height={120}>
        <ComposedChart data={data} margin={{top:5,right:5,bottom:0,left:-20}}>
          <CartesianGrid strokeDasharray="3 3" stroke={t.gridLine}/>
          <XAxis dataKey="week" tick={{fill:t.textDim,fontSize:10}} axisLine={false} tickLine={false}/>
          <YAxis tickFormatter={v=>`${(v*100).toFixed(0)}%`} tick={{fill:t.textDim,fontSize:10}} axisLine={false} tickLine={false} domain={['auto','auto']}/>
          <Tooltip contentStyle={{background:t.tooltipBg,border:`1px solid ${t.tooltipBorder}`,borderRadius:6,fontSize:12,color:t.text}} formatter={v=>[pct(v),label]} labelStyle={{color:t.textMuted}}/>
          <ReferenceLine y={threshold.warn} stroke="#f59e0b" strokeDasharray="4 4" strokeWidth={1}/>
          <ReferenceLine y={threshold.crit} stroke="#ef4444" strokeDasharray="4 4" strokeWidth={1}/>
          <Area type="monotone" dataKey={dataKey} fill={`${color}15`} stroke="none"/>
          <Line type="monotone" dataKey={dataKey} stroke={color} strokeWidth={2} dot={{r:3,fill:color,stroke:t.dotStroke,strokeWidth:2}}/>
        </ComposedChart>
      </ResponsiveContainer>
    </div>
  );
};

function App() {
  const [mode,setMode]=useState("light");
  const toggle=()=>setMode(m=>m==="dark"?"light":"dark");
  const theme=themes[mode];
  const [sv,setSv]=useState("oceancliff");
  const [view,setView]=useState("dashboard");
  const venue=VENUES[sv];
  const ratios=computeRatios(venue.weeklyData);
  const lr=ratios[ratios.length-1];
  const pr=ratios[ratios.length-2];
  const ac=Object.entries(THRESHOLDS).filter(([k,t])=>{const v=lr[k];return v!=null&&v>=t.warn;}).length;
  const cc=Object.entries(THRESHOLDS).filter(([k,t])=>{const v=lr[k];return v!=null&&v>=t.crit;}).length;
  const excess=venue.ytd2025.payrollExp-(venue.ytd2024.payrollExp*(venue.ytd2025.totalIncome/venue.ytd2024.totalIncome));

  // Responsive
  const [w,setW]=useState(window.innerWidth);
  useEffect(()=>{const h=()=>setW(window.innerWidth);window.addEventListener('resize',h);return()=>window.removeEventListener('resize',h);},[]);
  const mobile=w<768;

  return (
    <ThemeContext.Provider value={{mode,toggle,theme}}>
      <div style={{minHeight:"100vh",background:theme.bg,color:theme.text,transition:"background 0.3s,color 0.3s"}}>

        {/* HEADER */}
        <div style={{
          borderBottom:`1px solid ${theme.borderStrong}`,padding:mobile?"12px 16px":"16px 24px",
          display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:12,
          background:theme.headerBg,transition:"all 0.3s",position:"sticky",top:0,zIndex:10,
          backdropFilter:"blur(12px)",WebkitBackdropFilter:"blur(12px)",
        }}>
          <div>
            <span style={{fontFamily:"'Instrument Serif',serif",fontSize:mobile?18:22,color:theme.text,letterSpacing:"-0.02em"}}>IDC Financial Pulse</span>
            <div style={{fontSize:11,color:theme.textDim,letterSpacing:"0.08em",textTransform:"uppercase"}}>Weekly P&L Variance Analysis</div>
          </div>
          <div style={{display:"flex",alignItems:"center",gap:mobile?8:12,flexWrap:"wrap"}}>
            <div style={{display:"flex",background:theme.tabBg,borderRadius:6,padding:2,gap:2}}>
              {Object.entries(VENUES).map(([k,v])=>(
                <button key={k} onClick={()=>setSv(k)} style={{padding:mobile?"5px 10px":"6px 14px",borderRadius:4,border:"none",cursor:"pointer",fontSize:mobile?11:12,fontWeight:500,fontFamily:"'DM Sans',sans-serif",background:sv===k?theme.activeTab:"transparent",color:sv===k?theme.text:theme.textDim,transition:"all 0.2s"}}>{v.name.split(" ")[0]}</button>
              ))}
            </div>
            {ac>0&&!mobile&&(
              <div style={{display:"flex",alignItems:"center",gap:6,padding:"5px 12px",borderRadius:20,fontSize:12,fontWeight:600,background:cc>0?theme.alertCritBg:theme.alertWarnBg,color:cc>0?"#ef4444":"#f59e0b",border:`1px solid ${cc>0?"rgba(239,68,68,0.3)":"rgba(245,158,11,0.25)"}`}}>
                {cc>0?"⚠":"●"} {ac} Alert{ac!==1?"s":""}
              </div>
            )}
            {!mobile&&<div style={{fontSize:12,color:theme.textDim,padding:"5px 10px",background:theme.bgSub,borderRadius:4}}>Week ending Feb 8, 2025</div>}
            <Toggle/>
          </div>
        </div>

        <div style={{padding:mobile?"16px":"20px 24px",maxWidth:1200,margin:"0 auto"}}>
          {/* Mobile date + alerts */}
          {mobile&&(
            <div style={{display:"flex",gap:8,marginBottom:12,alignItems:"center"}}>
              <div style={{fontSize:11,color:theme.textDim,padding:"4px 8px",background:theme.bgSub,borderRadius:4}}>Week ending Feb 8, 2025</div>
              {ac>0&&<div style={{fontSize:11,fontWeight:600,color:cc>0?"#ef4444":"#f59e0b"}}>{cc>0?"⚠":"●"} {ac} Alert{ac!==1?"s":""}</div>}
            </div>
          )}

          {/* View tabs */}
          <div style={{display:"flex",gap:2,marginBottom:20,background:theme.tabBg,borderRadius:6,padding:2,width:"fit-content"}}>
            {[["dashboard","Dashboard"],["alerts","Alerts & Ratios"],["detail","P&L Detail"]].map(([k,l])=>(
              <button key={k} onClick={()=>setView(k)} style={{padding:"6px 16px",borderRadius:4,border:"none",cursor:"pointer",fontSize:12,fontWeight:500,fontFamily:"'DM Sans',sans-serif",background:view===k?theme.activeTab:"transparent",color:view===k?theme.text:theme.textDim,transition:"all 0.2s"}}>{l}</button>
            ))}
          </div>

          {/* DASHBOARD VIEW */}
          {view==="dashboard"&&(<>
            {excess>5000&&(
              <div style={{background:theme.alertCritBg,border:`1px solid ${theme.alertCritBorder}`,borderRadius:8,padding:mobile?"12px":"14px 18px",marginBottom:16,display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:8}}>
                <div style={{flex:1,minWidth:200}}>
                  <div style={{fontSize:13,fontWeight:600,color:"#ef4444",marginBottom:2}}>⚠ Estimated Excess Labor Cost Detected</div>
                  <div style={{fontSize:12,color:theme.textMuted}}>YTD payroll running {fmt(excess)} above revenue-adjusted PY benchmark. Annualized: ~{fmt(excess*52/8)}.</div>
                </div>
                <div style={{fontSize:mobile?20:24,fontWeight:700,color:"#ef4444",fontFamily:"'DM Mono',monospace"}}>{fmt(excess)}</div>
              </div>
            )}
            <div style={{display:"grid",gridTemplateColumns:mobile?"repeat(2,1fr)":"repeat(auto-fit,minmax(150px,1fr))",gap:mobile?8:10,marginBottom:20}}>
              <Card label="Total Revenue" value={venue.ytd2025.totalIncome} prev={venue.ytd2024.totalIncome}/>
              <Card label="Net Income" value={venue.ytd2025.netIncome} prev={venue.ytd2024.netIncome}/>
              <Card label="Total Payroll" value={venue.ytd2025.payrollExp} prev={venue.ytd2024.payrollExp}/>
              <Card label="Payroll / Rev" value={lr.payrollToRev} isRatio prev={pr.payrollToRev}/>
              <Card label="COGS" value={venue.ytd2025.cogsSold} prev={venue.ytd2024.cogsSold}/>
              <Card label="COG Food / Food" value={lr.cogFoodToFoodRev} isRatio prev={pr.cogFoodToFoodRev}/>
            </div>
            <div style={{display:"grid",gridTemplateColumns:mobile?"1fr":"1fr 1fr",gap:14,marginBottom:16}}>
              <RevChart data={venue.weeklyData}/>
              <PayComp d25={venue.payrollDetail2025} d24={venue.payrollDetail2024}/>
            </div>
            <div style={{display:"grid",gridTemplateColumns:mobile?"1fr":"1fr 1fr 1fr",gap:14}}>
              <RChart data={ratios} dataKey="kitchenToFood" threshold={THRESHOLDS.kitchenToFood} label="Kitchen Payroll / Food Revenue" color="#06b6d4"/>
              <RChart data={ratios} dataKey="payrollToRev" threshold={THRESHOLDS.payrollToRev} label="Total Payroll / Total Revenue" color="#a78bfa"/>
              <RChart data={ratios} dataKey="cogFoodToFoodRev" threshold={THRESHOLDS.cogFoodToFoodRev} label="COG Food / Food Revenue" color="#f59e0b"/>
              {lr.restToFBCarte!=null&&<RChart data={ratios} dataKey="restToFBCarte" threshold={THRESHOLDS.restToFBCarte} label="Restaurant / F&B À la Carte" color="#ef4444"/>}
              <RChart data={ratios} dataKey="banqToFBBanq" threshold={THRESHOLDS.banqToFBBanq} label="Banquet / F&B Banquets" color="#22c55e"/>
              {lr.roomsToRoomRev!=null&&<RChart data={ratios} dataKey="roomsToRoomRev" threshold={THRESHOLDS.roomsToRoomRev} label="Rooms / Room Revenue" color="#6366f1"/>}
            </div>
          </>)}

          {/* ALERTS VIEW */}
          {view==="alerts"&&(
            <div>
              <div style={{marginBottom:16}}>
                <div style={{fontSize:16,fontWeight:600,color:theme.text,marginBottom:4}}>Alert Status — {venue.name}</div>
                <div style={{fontSize:12,color:theme.textDim}}>Current week ratios vs. configured thresholds.</div>
              </div>
              <div style={{background:theme.bgCard,border:`1px solid ${theme.border}`,borderRadius:8,overflow:"hidden",marginBottom:20}}>
                <div style={{padding:"10px 14px",borderBottom:`1px solid ${theme.borderStrong}`,display:"flex",justifyContent:"space-between"}}>
                  <span style={{fontSize:12,fontWeight:600,color:theme.textMuted,textTransform:"uppercase",letterSpacing:"0.05em"}}>Expense Ratio</span>
                  <span style={{fontSize:12,fontWeight:600,color:theme.textMuted,textTransform:"uppercase",letterSpacing:"0.05em"}}>Current / Thresholds</span>
                </div>
                {Object.entries(THRESHOLDS).map(([k,thr])=>{
                  const val=lr[k];if(val==null)return null;
                  const st=alertStatus(val,thr);
                  return (
                    <div key={k} style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"10px 14px",borderBottom:`1px solid ${theme.borderSub}`,background:st==="critical"?theme.alertCritRow:st==="warning"?theme.alertWarnRow:"transparent",borderLeft:st==="critical"?"3px solid #ef4444":st==="warning"?"3px solid #f59e0b":"3px solid transparent"}}>
                      <div style={{display:"flex",alignItems:"center",gap:10}}><Dot status={st}/><span style={{fontSize:13,color:theme.textSecondary}}>{thr.label}</span></div>
                      <div style={{display:"flex",alignItems:"center",gap:mobile?8:16,flexWrap:"wrap",justifyContent:"flex-end"}}>
                        <span style={{fontSize:14,fontWeight:600,fontFamily:"'DM Mono',monospace",color:st==="critical"?"#ef4444":st==="warning"?"#f59e0b":"#22c55e"}}>{pct(val)}</span>
                        <span style={{fontSize:11,color:theme.textDim}}>warn: {pct(thr.warn)} | crit: {pct(thr.crit)}</span>
                      </div>
                    </div>
                  );
                })}
              </div>
              <div style={{background:theme.bgCard,border:`1px solid ${theme.border}`,borderRadius:8,overflow:"hidden"}}>
                <div style={{padding:"10px 14px",borderBottom:`1px solid ${theme.borderStrong}`}}>
                  <span style={{fontSize:12,fontWeight:600,color:theme.textMuted,textTransform:"uppercase"}}>Weekly Ratio History</span>
                </div>
                <div style={{overflowX:"auto"}}>
                  <table style={{width:"100%",borderCollapse:"collapse",fontSize:12,minWidth:700}}>
                    <thead><tr style={{borderBottom:`1px solid ${theme.borderStrong}`}}>
                      <th style={{padding:"8px 14px",textAlign:"left",color:theme.textDim,fontWeight:500}}>Week</th>
                      {Object.values(THRESHOLDS).map(t=><th key={t.label} style={{padding:"8px 10px",textAlign:"right",color:theme.textDim,fontWeight:500,whiteSpace:"nowrap"}}>{t.label}</th>)}
                    </tr></thead>
                    <tbody>{ratios.map((r,i)=>(
                      <tr key={i} style={{borderBottom:`1px solid ${theme.borderSub}`}}>
                        <td style={{padding:"7px 14px",color:theme.textSecondary,fontFamily:"'DM Mono',monospace"}}>{r.week}</td>
                        {Object.entries(THRESHOLDS).map(([k,thr])=>{const v=r[k];const s=alertStatus(v,thr);return(
                          <td key={k} style={{padding:"7px 10px",textAlign:"right",fontFamily:"'DM Mono',monospace",color:v==null?theme.textFaint:s==="critical"?"#ef4444":s==="warning"?"#f59e0b":theme.textMuted}}>{v==null?"—":pct(v)}</td>
                        );})}
                      </tr>
                    ))}</tbody>
                  </table>
                </div>
              </div>
            </div>
          )}

          {/* P&L DETAIL VIEW */}
          {view==="detail"&&(
            <div>
              <div style={{marginBottom:16}}>
                <div style={{fontSize:16,fontWeight:600,color:theme.text,marginBottom:4}}>P&L Variance Detail — {venue.name}</div>
                <div style={{fontSize:12,color:theme.textDim}}>Year-to-date comparison, 2025 vs 2024.</div>
              </div>
              <div style={{background:theme.bgCard,border:`1px solid ${theme.border}`,borderRadius:8,overflow:"hidden"}}>
                {[
                  {label:"REVENUE",items:[
                    {n:"Food Revenue",a:venue.ytd2025.foodRev,b:venue.ytd2024.foodRev},
                    {n:"Beverage Revenue",a:venue.ytd2025.bevRev,b:venue.ytd2024.bevRev},
                    {n:"Guest Room Revenue",a:venue.ytd2025.roomRev,b:venue.ytd2024.roomRev},
                  ],total:{n:"Total Income",a:venue.ytd2025.totalIncome,b:venue.ytd2024.totalIncome}},
                  {label:"COST OF GOODS SOLD",items:[{n:"F&B COGS",a:venue.ytd2025.cogsSold,b:venue.ytd2024.cogsSold}]},
                  {label:"LABOR BY DEPARTMENT",items:[
                    {n:"Kitchen",a:venue.payrollDetail2025.kitchen,b:venue.payrollDetail2024.kitchen},
                    {n:"Banquets",a:venue.payrollDetail2025.banquets,b:venue.payrollDetail2024.banquets},
                    ...(venue.payrollDetail2025.restaurant>0?[{n:"Restaurant",a:venue.payrollDetail2025.restaurant,b:venue.payrollDetail2024.restaurant}]:[]),
                    ...(venue.payrollDetail2025.rooms>0?[{n:"Rooms",a:venue.payrollDetail2025.rooms,b:venue.payrollDetail2024.rooms}]:[]),
                    {n:"Admin",a:venue.payrollDetail2025.admin,b:venue.payrollDetail2024.admin},
                    {n:"Catering",a:venue.payrollDetail2025.catering,b:venue.payrollDetail2024.catering},
                  ],total:{n:"Total Payroll",a:venue.ytd2025.payrollExp,b:venue.ytd2024.payrollExp}},
                  {label:"BOTTOM LINE",items:[{n:"Net Income",a:venue.ytd2025.netIncome,b:venue.ytd2024.netIncome}]},
                ].map(sec=>(
                  <div key={sec.label}>
                    <div style={{padding:"10px 14px",background:theme.sectionBg,borderBottom:`1px solid ${theme.borderStrong}`}}>
                      <span style={{fontSize:11,fontWeight:600,color:theme.textDim,letterSpacing:"0.08em"}}>{sec.label}</span>
                    </div>
                    <div style={{overflowX:"auto"}}>
                    <table style={{width:"100%",borderCollapse:"collapse",minWidth:500}}>
                      <thead><tr style={{borderBottom:`1px solid ${theme.borderSub}`}}>
                        {["Line Item","2025 YTD","2024 YTD","Var ($)","Var (%)"].map((h,i)=>(
                          <th key={h} style={{padding:"6px 14px",textAlign:i===0?"left":"right",color:theme.textDim,fontSize:11,fontWeight:500}}>{h}</th>
                        ))}
                      </tr></thead>
                      <tbody>
                        {sec.items.filter(i=>i.a>0||i.b>0).map(item=>{
                          const v=item.a-item.b;
                          const p=item.b!==0?v/Math.abs(item.b):0;
                          const isExp=sec.label.includes("LABOR")||sec.label.includes("COST");
                          const bad=isExp?v>0:v<0;
                          return (
                            <tr key={item.n} style={{borderBottom:`1px solid ${theme.borderSub}`}}>
                              <td style={{padding:"7px 14px",color:theme.textSecondary,fontSize:12}}>{item.n}</td>
                              <td style={{padding:"7px 14px",textAlign:"right",fontFamily:"'DM Mono',monospace",fontSize:12,color:theme.textSecondary}}>{fmt(item.a)}</td>
                              <td style={{padding:"7px 14px",textAlign:"right",fontFamily:"'DM Mono',monospace",fontSize:12,color:theme.textMuted}}>{fmt(item.b)}</td>
                              <td style={{padding:"7px 14px",textAlign:"right",fontFamily:"'DM Mono',monospace",fontSize:12,color:bad?"#ef4444":"#22c55e"}}>{v>=0?"+":""}{fmt(v)}</td>
                              <td style={{padding:"7px 14px",textAlign:"right",fontFamily:"'DM Mono',monospace",fontSize:12,color:bad?"#ef4444":"#22c55e"}}>{p>=0?"▲":"▼"} {pct(Math.abs(p))}</td>
                            </tr>
                          );
                        })}
                        {sec.total&&(
                          <tr style={{borderBottom:`1px solid ${theme.borderStrong}`,background:theme.sectionBg}}>
                            <td style={{padding:"8px 14px",color:theme.text,fontSize:12,fontWeight:600}}>{sec.total.n}</td>
                            <td style={{padding:"8px 14px",textAlign:"right",fontFamily:"'DM Mono',monospace",fontSize:12,fontWeight:600,color:theme.text}}>{fmt(sec.total.a)}</td>
                            <td style={{padding:"8px 14px",textAlign:"right",fontFamily:"'DM Mono',monospace",fontSize:12,fontWeight:600,color:theme.textMuted}}>{fmt(sec.total.b)}</td>
                            <td style={{padding:"8px 14px",textAlign:"right",fontFamily:"'DM Mono',monospace",fontSize:12,fontWeight:600,color:(sec.total.a-sec.total.b)>0&&sec.label.includes("LABOR")?"#ef4444":"#22c55e"}}>{fmt(sec.total.a-sec.total.b)}</td>
                            <td style={{padding:"8px 14px",textAlign:"right",fontFamily:"'DM Mono',monospace",fontSize:12,fontWeight:600,color:theme.textMuted}}>{pct(Math.abs(dlt(sec.total.a,sec.total.b)))}</td>
                          </tr>
                        )}
                      </tbody>
                    </table>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          )}

          {/* FOOTER */}
          <div style={{marginTop:24,padding:"14px 0",borderTop:`1px solid ${theme.borderStrong}`,display:"flex",justifyContent:"space-between",flexWrap:"wrap",gap:8}}>
            <div style={{fontSize:11,color:theme.textFaint}}>IDC Financial Pulse — Automated P&L Variance & Anomaly Detection</div>
            <div style={{fontSize:11,color:theme.textFaint}}>Prototype · Sample data · Thresholds configurable per venue</div>
          </div>
        </div>
      </div>
    </ThemeContext.Provider>
  );
}

ReactDOM.render(<App/>, document.getElementById('root'));
</script>
</body>
</html>

  banqToFBBanq:{warn:0.14,crit:0.16,label:"Banquets / F&B Banq"},
  restToFBCarte:{warn:0.25,crit:0.35,label:"Restaurant / F&B À la Carte"},
  roomsToRoomRev:{warn:0.27,crit:0.32,label:"Rooms / Room Rev"},
  payrollToRev:{warn:0.25,crit:0.28,label:"Total Payroll / Revenue"},
  cogFoodToFoodRev:{warn:0.16,crit:0.19,label:"COG Food / Food Rev"},
};

const fmt = n => n>=1e6?`$${(n/1e6).toFixed(1)}M`:n>=1e3?`$${(n/1e3).toFixed(0)}K`:`$${n.toFixed(0)}`;
const pct = n => `${(n*100).toFixed(1)}%`;
const dlt = (a,b) => b!==0?((a-b)/Math.abs(b)):0;

function computeRatios(data) {
  return data.map(w => {
    const tr = w.food+w.bev+(w.rooms||0);
    const tp = w.kitchenPay+w.banqPay+w.restPay+w.roomsPay+w.adminPay+w.cateringPay;
    return {
      week:w.week, kitchenToFood:w.kitchenPay/w.food,
      banqToFBBanq:w.banqPay/(w.food*0.82),
      restToFBCarte:w.restPay>0?w.restPay/(w.food*0.12+w.bev*0.18):null,
      roomsToRoomRev:w.rooms>0?w.roomsPay/w.rooms:null,
      payrollToRev:tp/tr, cogFoodToFoodRev:w.cogFood/w.food, totalRev:tr, totalPayroll:tp,
    };
  });
}

function alertStatus(v,t){if(v==null)return"na";if(v>=t.crit)return"critical";if(v>=t.warn)return"warning";return"ok";}

const Dot = ({status}) => {
  const c={ok:"#22c55e",warning:"#f59e0b",critical:"#ef4444",na:"#6b7280"};
  return <span style={{display:"inline-block",width:10,height:10,borderRadius:"50%",backgroundColor:c[status],boxShadow:status==="critical"?"0 0 8px rgba(239,68,68,0.6)":status==="warning"?"0 0 6px rgba(245,158,11,0.4)":"none"}}/>;
};

const Toggle = () => {
  const {mode,toggle}=useContext(ThemeContext);
  return (
    <button onClick={toggle} aria-label="Toggle theme" style={{
      position:"relative",width:52,height:28,borderRadius:14,border:"none",cursor:"pointer",
      background:mode==="dark"?"rgba(255,255,255,0.08)":"rgba(0,0,0,0.1)",
      transition:"all 0.3s ease",display:"flex",alignItems:"center",padding:"0 4px",
    }}>
      <div style={{
        width:20,height:20,borderRadius:"50%",transition:"all 0.3s cubic-bezier(0.4,0,0.2,1)",
        transform:mode==="dark"?"translateX(0px)":"translateX(24px)",
        background:mode==="dark"?"#1a2332":"#fff",
        display:"flex",alignItems:"center",justifyContent:"center",
        boxShadow:"0 1px 3px rgba(0,0,0,0.3)",

};

const Card = ({label,value,prev,isRatio=false}) => {
  const {theme:t}=useContext(ThemeContext);
  const d=prev?dlt(value,prev):0;
  const bad=isRatio?d>0:d<0;
  return (
    <div style={{background:t.bgCard,border:`1px solid ${t.border}`,borderRadius:8,padding:"14px 16px",minWidth:0}}>
      <div style={{fontSize:11,color:t.textMuted,letterSpacing:"0.05em",textTransform:"uppercase",marginBottom:6,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{label}</div>
      <div style={{fontSize:20,fontWeight:600,color:t.text,fontFamily:"'DM Mono',monospace"}}>{isRatio?pct(value):fmt(value)}</div>
      {prev!=null&&<div style={{fontSize:12,marginTop:4,color:bad?"#ef4444":"#22c55e",fontFamily:"'DM Mono',monospace"}}>{d>0?"▲":"▼"} {pct(Math.abs(d))} vs PY</div>}
    </div>
  );
};

          <CartesianGrid strokeDasharray="3 3" stroke={t.gridLine}/>

          <ReferenceLine y={threshold.crit} stroke="#ef4444" strokeDasharray="4 4" strokeWidth={1}/>

  );
};

          <XAxis dataKey="week" tick={{fill:t.textDim,fontSize:10}} axisLine={false} tickLine={false}/>
          <YAxis tickFormatter={v=>`$${(v/1000).toFixed(0)}K`} tick={{fill:t.textDim,fontSize:10}} axisLine={false} tickLine={false}/>
          <Tooltip contentStyle={{background:t.tooltipBg,border:`1px solid ${t.tooltipBorder}`,borderRadius:6,fontSize:12,color:t.text}} formatter={v=>[fmt(v)]} labelStyle={{color:t.textMuted}}/>
          <Area type="monotone" dataKey="Rooms" stackId="1" stroke="#6366f1" fill="#6366f120" strokeWidth={1.5}/>
          <Area type="monotone" dataKey="Beverage" stackId="1" stroke="#06b6d4" fill="#06b6d420" strokeWidth={1.5}/>
          <Area type="monotone" dataKey="Food" stackId="1" stroke="#22c55e" fill="#22c55e20" strokeWidth={1.5}/>
        </AreaChart>
      </ResponsiveContainer>
      <div style={{display:"flex",gap:16,marginTop:6,justifyContent:"center"}}>
        {[["Food","#22c55e"],["Beverage","#06b6d4"],["Rooms","#6366f1"]].map(([l,c])=>(
          <div key={l} style={{display:"flex",alignItems:"center",gap:6,fontSize:11,color:t.textDim}}>
            <div style={{width:10,height:10,borderRadius:2,background:c}}/>{l}
          </div>
        ))}
      </div>
    </div>
  );
};

function App() {
  const [mode,setMode]=useState("light");
  const toggle=()=>setMode(m=>m==="dark"?"light":"dark");
  const theme=themes[mode];
  const [sv,setSv]=useState("oceancliff");
  const [view,setView]=useState("dashboard");
  const [selYears,setSelYears]=useState(new Set([2025,2024,2023]));
  const [preview,setPreview]=useState("desktop"); // "desktop" | "mobile"
  const venue=VENUES[sv];
  const ratios=computeRatios(venue.weeklyData);
  const lr=ratios[ratios.length-1];
  const pr=ratios[ratios.length-2];
  const ac=Object.entries(THRESHOLDS).filter(([k,t])=>{const v=lr[k];return v!=null&&v>=t.warn;}).length;
  const cc=Object.entries(THRESHOLDS).filter(([k,t])=>{const v=lr[k];return v!=null&&v>=t.crit;}).length;
  const excess=venue.ytd2025.payrollExp-(venue.ytd2024.payrollExp*(venue.ytd2025.totalIncome/venue.ytd2024.totalIncome));

  // Responsive
  const [w,setW]=useState(window.innerWidth);
  useEffect(()=>{const h=()=>setW(window.innerWidth);window.addEventListener('resize',h);return()=>window.removeEventListener('resize',h);},[]);
  const mobile=preview==="mobile"||w<768;
  const isMobilePreview=preview==="mobile"&&w>=768;

  const dashboardContent = (
      <div style={{minHeight:isMobilePreview?"auto":"100vh",background:theme.bg,color:theme.text,transition:"background 0.3s,color 0.3s"}}>

        {/* HEADER */}
        <div style={{
          borderBottom:`1px solid ${theme.borderStrong}`,padding:mobile?"12px 16px":"16px 24px",
          display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:12,
          background:theme.headerBg,transition:"all 0.3s",position:isMobilePreview?"relative":"sticky",top:0,zIndex:10,
          backdropFilter:"blur(12px)",WebkitBackdropFilter:"blur(12px)",
        }}>
          <div>
            <span style={{fontFamily:"'Instrument Serif',serif",fontSize:mobile?18:22,color:theme.text,letterSpacing:"-0.02em"}}>IDC Financial Pulse</span>
            <div style={{fontSize:11,color:theme.textDim,letterSpacing:"0.08em",textTransform:"uppercase"}}>Weekly P&L Variance Analysis</div>
          </div>
          <div style={{display:"flex",alignItems:"center",gap:mobile?8:12,flexWrap:"wrap"}}>
            <div style={{display:"flex",background:theme.tabBg,borderRadius:6,padding:2,gap:2}}>
              {Object.entries(VENUES).map(([k,v])=>(
                <button key={k} onClick={()=>setSv(k)} style={{padding:mobile?"5px 10px":"6px 14px",borderRadius:4,border:"none",cursor:"pointer",fontSize:mobile?11:12,fontWeight:500,fontFamily:"'DM Sans',sans-serif",background:sv===k?theme.activeTab:"transparent",color:sv===k?theme.text:theme.textDim,transition:"all 0.2s"}}>{v.name}</button>
              ))}
            </div>
            {ac>0&&!mobile&&(
              <div style={{display:"flex",alignItems:"center",gap:6,padding:"5px 12px",borderRadius:20,fontSize:12,fontWeight:600,background:cc>0?theme.alertCritBg:theme.alertWarnBg,color:cc>0?"#ef4444":"#f59e0b",border:`1px solid ${cc>0?"rgba(239,68,68,0.3)":"rgba(245,158,11,0.25)"}`}}>
                {cc>0?"⚠":"●"} {ac} Alert{ac!==1?"s":""}
              </div>
            )}
            {!mobile&&<div style={{fontSize:12,color:theme.textDim,padding:"5px 10px",background:theme.bgSub,borderRadius:4}}>Week ending Feb 8, 2025</div>}
            {!isMobilePreview&&<button onClick={()=>setPreview(p=>p==="desktop"?"mobile":"desktop")} aria-label="Toggle device preview" style={{
              display:"flex",alignItems:"center",gap:6,padding:"5px 12px",borderRadius:6,border:"none",cursor:"pointer",
              background:theme.tabBg,color:theme.textDim,
              fontSize:12,fontWeight:500,fontFamily:"'DM Sans',sans-serif",transition:"all 0.2s",
            }}>
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="5" y="2" width="14" height="20" rx="2" ry="2"/><line x1="12" y1="18" x2="12" y2="18"/></svg>
              Mobile
            </button>}
            <Toggle/>
          </div>
        </div>

        <div style={{padding:mobile?"16px":"20px 24px",maxWidth:1200,margin:"0 auto"}}>
          {/* Mobile date + alerts */}
          {mobile&&(
            <div style={{display:"flex",gap:8,marginBottom:12,alignItems:"center"}}>
              <div style={{fontSize:11,color:theme.textDim,padding:"4px 8px",background:theme.bgSub,borderRadius:4}}>Week ending Feb 8, 2025</div>
              {ac>0&&<div style={{fontSize:11,fontWeight:600,color:cc>0?"#ef4444":"#f59e0b"}}>{cc>0?"⚠":"●"} {ac} Alert{ac!==1?"s":""}</div>}
            </div>
          )}

          {/* View tabs */}
          <div style={{display:"flex",gap:2,marginBottom:20,background:theme.tabBg,borderRadius:6,padding:2,width:"fit-content"}}>
            {[["dashboard","Dashboard"],["yoy","YoY Trends"],["alerts","Alerts & Ratios"],["detail","P&L Detail"]].map(([k,l])=>(
              <button key={k} onClick={()=>setView(k)} style={{padding:"6px 16px",borderRadius:4,border:"none",cursor:"pointer",fontSize:12,fontWeight:500,fontFamily:"'DM Sans',sans-serif",background:view===k?theme.activeTab:"transparent",color:view===k?theme.text:theme.textDim,transition:"all 0.2s"}}>{l}</button>
            ))}
          </div>

          {/* DASHBOARD VIEW */}
          {view==="dashboard"&&(<>
            {excess>5000&&(
              <div style={{background:theme.alertCritBg,border:`1px solid ${theme.alertCritBorder}`,borderRadius:8,padding:mobile?"12px":"14px 18px",marginBottom:16,display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:8}}>
                <div style={{flex:1,minWidth:200}}>
                  <div style={{fontSize:13,fontWeight:600,color:"#ef4444",marginBottom:2}}>⚠ Estimated Excess Labor Cost Detected</div>
                  <div style={{fontSize:12,color:theme.textMuted}}>YTD payroll running {fmt(excess)} above revenue-adjusted PY benchmark. Annualized: ~{fmt(excess*52/8)}.</div>
                </div>
                <div style={{fontSize:mobile?20:24,fontWeight:700,color:"#ef4444",fontFamily:"'DM Mono',monospace"}}>{fmt(excess)}</div>
              </div>
            )}
            <div style={{display:"grid",gridTemplateColumns:mobile?"repeat(2,1fr)":"repeat(auto-fit,minmax(150px,1fr))",gap:mobile?8:10,marginBottom:20}}>
              <Card label="Total Revenue" value={venue.ytd2025.totalIncome} prev={venue.ytd2024.totalIncome}/>
              <Card label="Net Income" value={venue.ytd2025.netIncome} prev={venue.ytd2024.netIncome}/>
              <Card label="Total Payroll" value={venue.ytd2025.payrollExp} prev={venue.ytd2024.payrollExp}/>
              <Card label="Payroll / Rev" value={lr.payrollToRev} isRatio prev={pr.payrollToRev}/>
              <Card label="COGS" value={venue.ytd2025.cogsSold} prev={venue.ytd2024.cogsSold}/>
              <Card label="COG Food / Food" value={lr.cogFoodToFoodRev} isRatio prev={pr.cogFoodToFoodRev}/>
            </div>
            <div style={{display:"grid",gridTemplateColumns:mobile?"1fr":"1fr 1fr",gap:14,marginBottom:16}}>
              <RevChart data={venue.weeklyData}/>
              <PayComp d25={venue.payrollDetail2025} d24={venue.payrollDetail2024}/>
            </div>
            <div style={{display:"grid",gridTemplateColumns:mobile?"1fr":"1fr 1fr 1fr",gap:14}}>
              <RChart data={ratios} dataKey="kitchenToFood" threshold={THRESHOLDS.kitchenToFood} label="Kitchen Payroll / Food Revenue" color="#06b6d4"/>
              <RChart data={ratios} dataKey="payrollToRev" threshold={THRESHOLDS.payrollToRev} label="Total Payroll / Total Revenue" color="#a78bfa"/>
              <RChart data={ratios} dataKey="cogFoodToFoodRev" threshold={THRESHOLDS.cogFoodToFoodRev} label="COG Food / Food Revenue" color="#f59e0b"/>
              {lr.restToFBCarte!=null&&<RChart data={ratios} dataKey="restToFBCarte" threshold={THRESHOLDS.restToFBCarte} label="Restaurant / F&B À la Carte" color="#ef4444"/>}
              <RChart data={ratios} dataKey="banqToFBBanq" threshold={THRESHOLDS.banqToFBBanq} label="Banquet / F&B Banquets" color="#22c55e"/>
              {lr.roomsToRoomRev!=null&&<RChart data={ratios} dataKey="roomsToRoomRev" threshold={THRESHOLDS.roomsToRoomRev} label="Rooms / Room Revenue" color="#6366f1"/>}
            </div>
          </>)}

          {/* YOY TRENDS VIEW */}
          {view==="yoy"&&(()=>{
            const ALL_YEARS=[2025,2024,2023,2022,2021];
            const YEAR_COLORS={2025:"#ef4444",2024:"#06b6d4",2023:"#a78bfa",2022:"#f59e0b",2021:"#6b7280"};
            const toggleYear=(yr)=>{
              setSelYears(prev=>{const n=new Set(prev);if(n.has(yr)){if(n.size>1)n.delete(yr);}else{n.add(yr);}return n;});
            };
            const years=[...selYears].sort((a,b)=>b-a);

            // Compute per-week totals for selected years
            const merged=Array.from({length:8},(_,i)=>{
              const row={week:`W${i+1}`};
              years.forEach(yr=>{
                const w=venue.history[yr]?.[i];
                if(!w)return;
                const tr=w.food+w.bev+(w.rooms||0);
                const tp=w.kitchenPay+w.banqPay+w.restPay+w.roomsPay+w.adminPay+w.cateringPay;
                row[`rev_${yr}`]=tr;
                row[`pay_${yr}`]=tp;
                row[`food_${yr}`]=w.food;
                row[`bev_${yr}`]=w.bev;
                row[`rooms_${yr}`]=w.rooms||0;
                row[`kit_${yr}`]=w.kitchenPay;
                row[`banq_${yr}`]=w.banqPay;
                row[`cog_${yr}`]=w.cogFood;
                row[`payRatio_${yr}`]=tp/tr;
                row[`cogRatio_${yr}`]=w.cogFood/w.food;
                row[`kitRatio_${yr}`]=w.kitchenPay/w.food;
              });
              return row;
            });

            // Anomaly detection: compare most recent year to each prior year
            const newest=Math.max(...years);
            const anomalies=[];
            merged.forEach(row=>{
              years.filter(y=>y!==newest).forEach(yr=>{
                const pairs=[
                  ["Total Revenue",`rev_${newest}`,`rev_${yr}`,false],
                  ["Total Payroll",`pay_${newest}`,`pay_${yr}`,true],
                  ["Kitchen Payroll",`kit_${newest}`,`kit_${yr}`,true],
                  ["COG Food",`cog_${newest}`,`cog_${yr}`,true],
                ];
                pairs.forEach(([metric,k1,k2,isExp])=>{
                  if(row[k1]==null||row[k2]==null)return;
                  const chg=dlt(row[k1],row[k2]);
                  const thresh=isExp?0.15:-0.10;
                  const critThresh=isExp?0.30:-0.20;
                  if((isExp&&chg>thresh)||(!isExp&&chg<thresh)){
                    anomalies.push({week:row.week,metric,yr:newest,vsYr:yr,valNew:row[k1],valOld:row[k2],pct:chg,
                      severity:(isExp&&chg>critThresh)||(!isExp&&chg<critThresh)?"critical":"warning"});
                  }
                });
              });
            });
            // Deduplicate: keep worst severity per week+metric
            const aKey=a=>`${a.week}-${a.metric}`;
            const aMap=new Map();
            anomalies.forEach(a=>{const k=aKey(a);if(!aMap.has(k)||a.severity==="critical")aMap.set(k,a);});
            const dedupedAnomalies=[...aMap.values()].sort((a,b)=>a.week.localeCompare(b.week));

            const MultiChart=({label,keyPrefix,isRatio=false})=>(
              <div style={{background:theme.bgCard,border:`1px solid ${theme.border}`,borderRadius:8,padding:"14px 16px"}}>
                <div style={{fontSize:12,color:theme.textMuted,marginBottom:8}}>{label}</div>
                <ResponsiveContainer width="100%" height={150}>
                  <ComposedChart data={merged} margin={{top:5,right:5,bottom:0,left:isRatio?-20:-10}}>
                    <CartesianGrid strokeDasharray="3 3" stroke={theme.gridLine}/>
                    <XAxis dataKey="week" tick={{fill:theme.textDim,fontSize:10}} axisLine={false} tickLine={false}/>
                    <YAxis tickFormatter={isRatio?(v=>`${(v*100).toFixed(0)}%`):(v=>`$${(v/1000).toFixed(0)}K`)} tick={{fill:theme.textDim,fontSize:10}} axisLine={false} tickLine={false} domain={isRatio?['auto','auto']:undefined}/>
                    <Tooltip contentStyle={{background:theme.tooltipBg,border:`1px solid ${theme.tooltipBorder}`,borderRadius:6,fontSize:12,color:theme.text}} formatter={v=>[isRatio?pct(v):fmt(v)]} labelStyle={{color:theme.textMuted}}/>
                    {isRatio&&keyPrefix==="payRatio"&&<><ReferenceLine y={THRESHOLDS.payrollToRev.warn} stroke="#f59e0b" strokeDasharray="4 4" strokeWidth={1}/><ReferenceLine y={THRESHOLDS.payrollToRev.crit} stroke="#ef4444" strokeDasharray="4 4" strokeWidth={1}/></>}
                    {isRatio&&keyPrefix==="cogRatio"&&<><ReferenceLine y={THRESHOLDS.cogFoodToFoodRev.warn} stroke="#f59e0b" strokeDasharray="4 4" strokeWidth={1}/><ReferenceLine y={THRESHOLDS.cogFoodToFoodRev.crit} stroke="#ef4444" strokeDasharray="4 4" strokeWidth={1}/></>}
                    {isRatio&&keyPrefix==="kitRatio"&&<><ReferenceLine y={THRESHOLDS.kitchenToFood.warn} stroke="#f59e0b" strokeDasharray="4 4" strokeWidth={1}/><ReferenceLine y={THRESHOLDS.kitchenToFood.crit} stroke="#ef4444" strokeDasharray="4 4" strokeWidth={1}/></>}
                    {years.map((yr,idx)=>(
                      <Line key={yr} type="monotone" dataKey={`${keyPrefix}_${yr}`}
                        stroke={YEAR_COLORS[yr]} strokeWidth={yr===newest?2.5:1.8}
                        strokeDasharray={yr===newest?"":"6 3"}
                        dot={{r:yr===newest?3:2.5,fill:YEAR_COLORS[yr],stroke:theme.dotStroke,strokeWidth:yr===newest?2:1.5}}
                        name={String(yr)} connectNulls/>
                    ))}
                  </ComposedChart>
                </ResponsiveContainer>
                <div style={{display:"flex",gap:12,marginTop:6,justifyContent:"center",flexWrap:"wrap"}}>
                  {years.map(yr=>(
                    <div key={yr} style={{display:"flex",alignItems:"center",gap:5,fontSize:11,color:theme.textDim}}>
                      <div style={{width:16,height:2,background:YEAR_COLORS[yr],borderRadius:1,borderTop:yr!==newest?`2px dashed ${YEAR_COLORS[yr]}`:"none"}}/>
                      {yr}
                    </div>
                  ))}
                </div>
              </div>
            );

            return (
              <div>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",flexWrap:"wrap",gap:12,marginBottom:16}}>
                  <div>
                    <div style={{fontSize:16,fontWeight:600,color:theme.text,marginBottom:4}}>Historical Trends — {venue.name}</div>
                    <div style={{fontSize:12,color:theme.textDim}}>Multi-year weekly overlay. Select years to compare. Anomalies flagged vs. most recent year.</div>
                  </div>
                  <div style={{display:"flex",flexDirection:"column",alignItems:"flex-end",gap:4}}>
                    <div style={{fontSize:10,color:theme.textDim,textTransform:"uppercase",letterSpacing:"0.05em",fontWeight:500}}>Click to toggle years ↓</div>
                    <div style={{display:"flex",gap:4,flexWrap:"wrap"}}>
                    {ALL_YEARS.map(yr=>(
                      <button key={yr} onClick={()=>toggleYear(yr)} title={selYears.has(yr)?`Hide ${yr}`:`Show ${yr}`} style={{
                        padding:"5px 12px",borderRadius:4,border:`2px solid ${YEAR_COLORS[yr]}`,cursor:"pointer",
                        fontSize:12,fontWeight:600,fontFamily:"'DM Mono',monospace",transition:"all 0.2s",
                        background:selYears.has(yr)?YEAR_COLORS[yr]+"18":"transparent",
                        color:selYears.has(yr)?YEAR_COLORS[yr]:theme.textFaint,
                        opacity:selYears.has(yr)?1:0.4,
                        display:"flex",alignItems:"center",gap:5,
                      }}><span style={{width:8,height:8,borderRadius:"50%",background:selYears.has(yr)?YEAR_COLORS[yr]:theme.textFaint,opacity:selYears.has(yr)?1:0.3,transition:"all 0.2s",flexShrink:0}}/>{yr}</button>
                    ))}
                    </div>
                  </div>
                </div>

                {/* Revenue & Payroll overlays */}
                <div style={{display:"grid",gridTemplateColumns:mobile?"1fr":"1fr 1fr",gap:14,marginBottom:14}}>
                  <MultiChart label="Total Revenue" keyPrefix="rev"/>
                  <MultiChart label="Total Payroll" keyPrefix="pay"/>
                </div>

                {/* Ratio overlays */}
                <div style={{display:"grid",gridTemplateColumns:mobile?"1fr":"1fr 1fr 1fr",gap:14,marginBottom:14}}>
                  <MultiChart label="Payroll / Revenue Ratio" keyPrefix="payRatio" isRatio/>
                  <MultiChart label="COG Food / Food Revenue" keyPrefix="cogRatio" isRatio/>
                  <MultiChart label="Kitchen / Food Revenue" keyPrefix="kitRatio" isRatio/>
                </div>

                {/* Department breakdowns */}
                <div style={{display:"grid",gridTemplateColumns:mobile?"1fr":"1fr 1fr 1fr",gap:14,marginBottom:14}}>
                  <MultiChart label="Food Revenue" keyPrefix="food"/>
                  <MultiChart label="Beverage Revenue" keyPrefix="bev"/>
                  {(venue.weeklyData[0].rooms>0)?<MultiChart label="Room Revenue" keyPrefix="rooms"/>:
                    <MultiChart label="Banquet Payroll" keyPrefix="banq"/>}
                  <MultiChart label="Kitchen Payroll" keyPrefix="kit"/>
                  <MultiChart label="COG Food" keyPrefix="cog"/>
                  {(venue.weeklyData[0].rooms>0)?<MultiChart label="Banquet Payroll" keyPrefix="banq"/>:null}
                </div>

                {/* Anomaly table */}
                {dedupedAnomalies.length>0&&(
                  <div style={{background:theme.bgCard,border:`1px solid ${theme.border}`,borderRadius:8,overflow:"hidden"}}>
                    <div style={{padding:"10px 14px",borderBottom:`1px solid ${theme.borderStrong}`,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                      <span style={{fontSize:12,fontWeight:600,color:theme.textMuted,textTransform:"uppercase",letterSpacing:"0.05em"}}>Detected Anomalies — {newest} vs Prior Years</span>
                      <span style={{fontSize:11,color:theme.textDim}}>{dedupedAnomalies.length} anomal{dedupedAnomalies.length===1?"y":"ies"}</span>
                    </div>
                    <div style={{overflowX:"auto"}}>
                      <table style={{width:"100%",borderCollapse:"collapse",fontSize:12,minWidth:650}}>
                        <thead><tr style={{borderBottom:`1px solid ${theme.borderStrong}`}}>
                          {["Week","Metric","Comparison",String(newest),"Prior","YoY Change","Severity"].map(h=>(
                            <th key={h} style={{padding:"8px 14px",textAlign:["Week","Metric","Comparison","Severity"].includes(h)?"left":"right",color:theme.textDim,fontWeight:500,fontSize:11}}>{h}</th>
                          ))}
                        </tr></thead>
                        <tbody>{dedupedAnomalies.map((a,i)=>(
                          <tr key={i} style={{borderBottom:`1px solid ${theme.borderSub}`,background:a.severity==="critical"?theme.alertCritRow:theme.alertWarnRow,borderLeft:a.severity==="critical"?"3px solid #ef4444":"3px solid #f59e0b"}}>
                            <td style={{padding:"7px 14px",fontFamily:"'DM Mono',monospace",color:theme.textSecondary}}>{a.week}</td>
                            <td style={{padding:"7px 14px",color:theme.textSecondary}}>{a.metric}</td>
                            <td style={{padding:"7px 14px",color:theme.textDim,fontSize:11}}>vs {a.vsYr}</td>
                            <td style={{padding:"7px 14px",textAlign:"right",fontFamily:"'DM Mono',monospace",color:theme.textSecondary}}>{fmt(a.valNew)}</td>
                            <td style={{padding:"7px 14px",textAlign:"right",fontFamily:"'DM Mono',monospace",color:theme.textMuted}}>{fmt(a.valOld)}</td>
                            <td style={{padding:"7px 14px",textAlign:"right",fontFamily:"'DM Mono',monospace",fontWeight:600,color:a.severity==="critical"?"#ef4444":"#f59e0b"}}>{a.pct>0?"▲":"▼"} {pct(Math.abs(a.pct))}</td>
                            <td style={{padding:"7px 14px"}}><span style={{display:"inline-block",padding:"2px 8px",borderRadius:10,fontSize:10,fontWeight:600,textTransform:"uppercase",background:a.severity==="critical"?theme.alertCritBg:theme.alertWarnBg,color:a.severity==="critical"?"#ef4444":"#f59e0b",border:`1px solid ${a.severity==="critical"?"rgba(239,68,68,0.3)":"rgba(245,158,11,0.3)"}`}}>{a.severity}</span></td>
                          </tr>
                        ))}</tbody>
                      </table>
                    </div>
                  </div>
                )}
              </div>
            );
          })()}

          {/* ALERTS VIEW */}
          {view==="alerts"&&(
            <div>
              <div style={{marginBottom:16}}>
                <div style={{fontSize:16,fontWeight:600,color:theme.text,marginBottom:4}}>Alert Status — {venue.name}</div>
                <div style={{fontSize:12,color:theme.textDim}}>Current week ratios vs. configured thresholds.</div>
              </div>
              <div style={{background:theme.bgCard,border:`1px solid ${theme.border}`,borderRadius:8,overflow:"hidden",marginBottom:20}}>
                <div style={{padding:"10px 14px",borderBottom:`1px solid ${theme.borderStrong}`,display:"flex",justifyContent:"space-between"}}>
                  <span style={{fontSize:12,fontWeight:600,color:theme.textMuted,textTransform:"uppercase",letterSpacing:"0.05em"}}>Expense Ratio</span>
                  <span style={{fontSize:12,fontWeight:600,color:theme.textMuted,textTransform:"uppercase",letterSpacing:"0.05em"}}>Current / Thresholds</span>
                </div>
                {Object.entries(THRESHOLDS).map(([k,thr])=>{
                  const val=lr[k];if(val==null)return null;
                  const st=alertStatus(val,thr);
                  return (
                    <div key={k} style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"10px 14px",borderBottom:`1px solid ${theme.borderSub}`,background:st==="critical"?theme.alertCritRow:st==="warning"?theme.alertWarnRow:"transparent",borderLeft:st==="critical"?"3px solid #ef4444":st==="warning"?"3px solid #f59e0b":"3px solid transparent"}}>
                      <div style={{display:"flex",alignItems:"center",gap:10}}><Dot status={st}/><span style={{fontSize:13,color:theme.textSecondary}}>{thr.label}</span></div>
                      <div style={{display:"flex",alignItems:"center",gap:mobile?8:16,flexWrap:"wrap",justifyContent:"flex-end"}}>
                        <span style={{fontSize:14,fontWeight:600,fontFamily:"'DM Mono',monospace",color:st==="critical"?"#ef4444":st==="warning"?"#f59e0b":"#22c55e"}}>{pct(val)}</span>
                        <span style={{fontSize:11,color:theme.textDim}}>warn: {pct(thr.warn)} | crit: {pct(thr.crit)}</span>
                      </div>
                    </div>
                  );
                })}
              </div>
              <div style={{background:theme.bgCard,border:`1px solid ${theme.border}`,borderRadius:8,overflow:"hidden"}}>
                <div style={{padding:"10px 14px",borderBottom:`1px solid ${theme.borderStrong}`}}>
                  <span style={{fontSize:12,fontWeight:600,color:theme.textMuted,textTransform:"uppercase"}}>Weekly Ratio History</span>
                </div>
                <div style={{overflowX:"auto"}}>
                  <table style={{width:"100%",borderCollapse:"collapse",fontSize:12,minWidth:700}}>
                    <thead><tr style={{borderBottom:`1px solid ${theme.borderStrong}`}}>
                      <th style={{padding:"8px 14px",textAlign:"left",color:theme.textDim,fontWeight:500}}>Week</th>
                      {Object.values(THRESHOLDS).map(t=><th key={t.label} style={{padding:"8px 10px",textAlign:"right",color:theme.textDim,fontWeight:500,whiteSpace:"nowrap"}}>{t.label}</th>)}
                    </tr></thead>
                    <tbody>{ratios.map((r,i)=>(
                      <tr key={i} style={{borderBottom:`1px solid ${theme.borderSub}`}}>
                        <td style={{padding:"7px 14px",color:theme.textSecondary,fontFamily:"'DM Mono',monospace"}}>{r.week}</td>
                        {Object.entries(THRESHOLDS).map(([k,thr])=>{const v=r[k];const s=alertStatus(v,thr);return(
                          <td key={k} style={{padding:"7px 10px",textAlign:"right",fontFamily:"'DM Mono',monospace",color:v==null?theme.textFaint:s==="critical"?"#ef4444":s==="warning"?"#f59e0b":theme.textMuted}}>{v==null?"—":pct(v)}</td>
                        );})}
                      </tr>
                    ))}</tbody>
                  </table>
                </div>
              </div>
            </div>
          )}

          {/* P&L DETAIL VIEW */}
          {view==="detail"&&(
            <div>
              <div style={{marginBottom:16}}>
                <div style={{fontSize:16,fontWeight:600,color:theme.text,marginBottom:4}}>P&L Variance Detail — {venue.name}</div>
                <div style={{fontSize:12,color:theme.textDim}}>Year-to-date comparison, 2025 vs 2024.</div>
              </div>
              <div style={{background:theme.bgCard,border:`1px solid ${theme.border}`,borderRadius:8,overflow:"hidden"}}>
                {[
                  {label:"REVENUE",items:[
                    {n:"Food Revenue",a:venue.ytd2025.foodRev,b:venue.ytd2024.foodRev},
                    {n:"Beverage Revenue",a:venue.ytd2025.bevRev,b:venue.ytd2024.bevRev},
                    {n:"Guest Room Revenue",a:venue.ytd2025.roomRev,b:venue.ytd2024.roomRev},
                  ],total:{n:"Total Income",a:venue.ytd2025.totalIncome,b:venue.ytd2024.totalIncome}},
                  {label:"COST OF GOODS SOLD",items:[{n:"F&B COGS",a:venue.ytd2025.cogsSold,b:venue.ytd2024.cogsSold}]},
                  {label:"LABOR BY DEPARTMENT",items:[
                    {n:"Kitchen",a:venue.payrollDetail2025.kitchen,b:venue.payrollDetail2024.kitchen},
                    {n:"Banquets",a:venue.payrollDetail2025.banquets,b:venue.payrollDetail2024.banquets},
                    ...(venue.payrollDetail2025.restaurant>0?[{n:"Restaurant",a:venue.payrollDetail2025.restaurant,b:venue.payrollDetail2024.restaurant}]:[]),
                    ...(venue.payrollDetail2025.rooms>0?[{n:"Rooms",a:venue.payrollDetail2025.rooms,b:venue.payrollDetail2024.rooms}]:[]),
                    {n:"Admin",a:venue.payrollDetail2025.admin,b:venue.payrollDetail2024.admin},
                    {n:"Catering",a:venue.payrollDetail2025.catering,b:venue.payrollDetail2024.catering},
                  ],total:{n:"Total Payroll",a:venue.ytd2025.payrollExp,b:venue.ytd2024.payrollExp}},
                  {label:"BOTTOM LINE",items:[{n:"Net Income",a:venue.ytd2025.netIncome,b:venue.ytd2024.netIncome}]},
                ].map(sec=>(
                  <div key={sec.label}>
                    <div style={{padding:"10px 14px",background:theme.sectionBg,borderBottom:`1px solid ${theme.borderStrong}`}}>
                      <span style={{fontSize:11,fontWeight:600,color:theme.textDim,letterSpacing:"0.08em"}}>{sec.label}</span>
                    </div>
                    <div style={{overflowX:"auto"}}>
                    <table style={{width:"100%",borderCollapse:"collapse",minWidth:500}}>
                      <thead><tr style={{borderBottom:`1px solid ${theme.borderSub}`}}>
                        {["Line Item","2025 YTD","2024 YTD","Var ($)","Var (%)"].map((h,i)=>(
                          <th key={h} style={{padding:"6px 14px",textAlign:i===0?"left":"right",color:theme.textDim,fontSize:11,fontWeight:500}}>{h}</th>
                        ))}
                      </tr></thead>
                      <tbody>
                        {sec.items.filter(i=>i.a>0||i.b>0).map(item=>{
                          const v=item.a-item.b;
                          const p=item.b!==0?v/Math.abs(item.b):0;
                          const isExp=sec.label.includes("LABOR")||sec.label.includes("COST");
                          const bad=isExp?v>0:v<0;
                          return (
                            <tr key={item.n} style={{borderBottom:`1px solid ${theme.borderSub}`}}>
                              <td style={{padding:"7px 14px",color:theme.textSecondary,fontSize:12}}>{item.n}</td>
                              <td style={{padding:"7px 14px",textAlign:"right",fontFamily:"'DM Mono',monospace",fontSize:12,color:theme.textSecondary}}>{fmt(item.a)}</td>
                              <td style={{padding:"7px 14px",textAlign:"right",fontFamily:"'DM Mono',monospace",fontSize:12,color:theme.textMuted}}>{fmt(item.b)}</td>
                              <td style={{padding:"7px 14px",textAlign:"right",fontFamily:"'DM Mono',monospace",fontSize:12,color:bad?"#ef4444":"#22c55e"}}>{v>=0?"+":""}{fmt(v)}</td>
                              <td style={{padding:"7px 14px",textAlign:"right",fontFamily:"'DM Mono',monospace",fontSize:12,color:bad?"#ef4444":"#22c55e"}}>{p>=0?"▲":"▼"} {pct(Math.abs(p))}</td>
                            </tr>
                          );
                        })}
                        {sec.total&&(
                          <tr style={{borderBottom:`1px solid ${theme.borderStrong}`,background:theme.sectionBg}}>
                            <td style={{padding:"8px 14px",color:theme.text,fontSize:12,fontWeight:600}}>{sec.total.n}</td>
                            <td style={{padding:"8px 14px",textAlign:"right",fontFamily:"'DM Mono',monospace",fontSize:12,fontWeight:600,color:theme.text}}>{fmt(sec.total.a)}</td>
                            <td style={{padding:"8px 14px",textAlign:"right",fontFamily:"'DM Mono',monospace",fontSize:12,fontWeight:600,color:theme.textMuted}}>{fmt(sec.total.b)}</td>
                            <td style={{padding:"8px 14px",textAlign:"right",fontFamily:"'DM Mono',monospace",fontSize:12,fontWeight:600,color:(sec.total.a-sec.total.b)>0&&sec.label.includes("LABOR")?"#ef4444":"#22c55e"}}>{fmt(sec.total.a-sec.total.b)}</td>
                            <td style={{padding:"8px 14px",textAlign:"right",fontFamily:"'DM Mono',monospace",fontSize:12,fontWeight:600,color:theme.textMuted}}>{pct(Math.abs(dlt(sec.total.a,sec.total.b)))}</td>
                          </tr>
                        )}
                      </tbody>
                    </table>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          )}

          {/* FOOTER */}
          <div style={{marginTop:24,padding:"14px 0",borderTop:`1px solid ${theme.borderStrong}`,display:"flex",justifyContent:"space-between",flexWrap:"wrap",gap:8}}>
            <div style={{fontSize:11,color:theme.textFaint}}>IDC Financial Pulse — Automated P&L Variance & Anomaly Detection</div>
            <div style={{fontSize:11,color:theme.textFaint}}>Prototype · Sample data · Thresholds configurable per venue</div>
          </div>
        </div>
      </div>
  );

  return (
    <ThemeContext.Provider value={{mode,toggle,theme}}>
      {isMobilePreview ? (
        <div style={{minHeight:"100vh",background:"#1a1a2e",display:"flex",flexDirection:"column",alignItems:"center",padding:"40px 20px"}}>
          {/* Top bar with controls */}
          <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:24}}>
            <button onClick={()=>setPreview("desktop")} style={{
              display:"flex",alignItems:"center",gap:6,padding:"8px 16px",borderRadius:8,border:"1px solid rgba(255,255,255,0.15)",cursor:"pointer",
              background:"rgba(255,255,255,0.06)",color:"#e8edf2",fontSize:13,fontWeight:500,fontFamily:"'DM Sans',sans-serif",transition:"all 0.2s",
            }}>
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
              Back to Desktop
            </button>
            <div style={{fontSize:13,color:"rgba(255,255,255,0.4)",fontFamily:"'DM Sans',sans-serif"}}>Mobile Preview · iPhone 14</div>
          </div>
          {/* Phone frame */}
          <div style={{
            width:393,borderRadius:44,padding:"14px 14px",
            background:"linear-gradient(145deg, #2a2a3a, #1a1a28)",
            boxShadow:"0 25px 80px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.08), inset 0 1px 0 rgba(255,255,255,0.06)",
          }}>
            {/* Notch / dynamic island */}
            <div style={{display:"flex",justifyContent:"center",marginBottom:6,position:"relative",zIndex:20}}>
              <div style={{width:120,height:34,borderRadius:20,background:"#000",position:"absolute",top:6}}/>
            </div>
            {/* Screen */}
            <div style={{
              borderRadius:32,overflow:"hidden",height:852,
              background:theme.bg,position:"relative",
            }}>
              <div style={{height:"100%",overflowY:"auto",overflowX:"hidden",WebkitOverflowScrolling:"touch"}}>
                {dashboardContent}
              </div>
            </div>
          </div>
          {/* Bottom hint */}
          <div style={{marginTop:20,fontSize:12,color:"rgba(255,255,255,0.25)",fontFamily:"'DM Sans',sans-serif",textAlign:"center"}}>
            Scroll inside the phone to explore · All views and venues are interactive
          </div>
        </div>
      ) : dashboardContent}
    </ThemeContext.Provider>
  );
}

if (ReactDOM.createRoot) {
  ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
} else {
  ReactDOM.render(<App/>, document.getElementById('root'));
}
</script>
</body>
</html>
